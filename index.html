<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WanderWise</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7fb, #dfeaf8);
            color: #1f2937;
        }

        .container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            padding: 2.5rem 3rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">>
            <p>Plan your next adventure with confidence.</p>
            <h1>WanderWise</h1>

            <p>This update was created on the feature-update branch.</p>

        </section>
    </main>
</body>

</html>
